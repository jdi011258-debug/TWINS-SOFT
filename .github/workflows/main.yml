name: Build TWINS SOFT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"

          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "${ANDROID_HOME}/platform-tools" >> "$GITHUB_PATH"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle
        shell: bash
        run: |
          curl -L \
            -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP project not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Searching for Gradle project..."

          PROJECT_DIR=""

          while IFS= read -r SETTINGS; do
            PROJECT_DIR=$(dirname "$SETTINGS")
            break
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \)
          )

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              | head -n 1)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=============================="
          echo "PROJECT FOUND:"
          echo "$PROJECT_DIR"
          echo "=============================="

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          echo "Building TWINS SOFT..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            find "$PROJECT_DIR" \
              -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          cp "$APK" TWINS-SOFT.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWINS-SOFT-debug
          path: TWINS-SOFT.apk
          if-no-files-found: error
