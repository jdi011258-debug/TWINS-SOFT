name: Build TWINS SOFT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"

          cd "$RUNNER_TEMP"

          curl -L -o commandlinetools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip

          unzip -q commandlinetools.zip

          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools/latest"

          cp -r cmdline-tools/* \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          sdkmanager --version

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -L -o gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip

          unzip -q gradle.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP project found"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          PROJECT_DIR=""

          SETTINGS_FILE=$(find extracted -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print -quit)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          fi

          if [ -z "$PROJECT_DIR" ]; then
            BUILD_FILE=$(find extracted -type f \
              \( -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print -quit)

            if [ -n "$BUILD_FILE" ]; then
              PROJECT_DIR=$(dirname "$BUILD_FILE")
            fi
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project was not found"
            find extracted -maxdepth 5 -type f | sort
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Build APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          APK=$(find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not created"
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/TWINS-SOFT.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TWINS-SOFT-APK
          path: TWINS-SOFT.apk
